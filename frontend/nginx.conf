# Template: the nginx image renders it to /etc/nginx/conf.d/default.conf at start with
# envsubst. Only MAX_UPLOAD_MB is substituted (NGINX_ENVSUBST_FILTER in the Dockerfile),
# so nginx's own variables such as $host and $remote_addr are left as they are.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same variable as the backend's upload limit (MAX_UPLOAD_MB in .env).
    client_max_body_size ${MAX_UPLOAD_MB}m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
